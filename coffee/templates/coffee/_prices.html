<div class="prices">
  {% if p.price_large %}
    <span class="size"><small>Medium</small>{{ currency }}{{ p.price }}</span>
    <span class="size"><small>Large</small>{{ currency }}{{ p.price_large }}</span>
  {% else %}
    <span class="price">{{ currency }}{{ p.price }}</span>
  {% endif %}
</div>
